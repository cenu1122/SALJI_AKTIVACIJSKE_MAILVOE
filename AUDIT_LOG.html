
<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DocBizHub - Audit Log</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #0b1120;
      color: #e5e7eb;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 1300px;
      margin: 35px auto;
    }

    .panel {
      background: #151e30;
      border: 1px solid #29364c;
      border-radius: 14px;
      padding: 25px;
      margin-bottom: 20px;
    }

    h1 {
      color: #60a5fa;
      margin-top: 0;
    }

    h2 {
      color: #93c5fd;
    }

    label {
      display: block;
      margin-top: 15px;
      font-size: 14px;
      color: #cbd5e1;
    }

    input {
      display: block;
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0b1120;
      color: white;
      font-size: 16px;
    }

    button {
      padding: 12px 20px;
      margin: 12px 6px 0 0;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .danger {
      background: #b91c1c;
    }

    .danger:hover {
      background: #991b1b;
    }

    .hidden {
      display: none !important;
    }

    .error {
      color: #f87171;
      margin-top: 15px;
      overflow-wrap: anywhere;
    }

    .success {
      color: #4ade80;
      margin-top: 10px;
    }

    .muted {
      color: #94a3b8;
      font-size: 13px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 950px;
      border-collapse: collapse;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #29364c;
      text-align: left;
      vertical-align: top;
      font-size: 13px;
    }

    th {
      background: #101a2b;
      color: #93c5fd;
    }

    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      max-width: 350px;
      margin: 0;
      color: #cbd5e1;
      font-size: 12px;
    }

    .status {
      color: #4ade80;
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      .panel {
        padding: 17px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <!-- PRIJAVA -->
  <section id="loginScreen" class="panel">
    <h1>DocBizHub – Audit Log</h1>

    <p class="muted">
      Prijavi se administratorskim Supabase nalogom
      da bi pristupio evidenciji promjena.
    </p>

    <label for="email">Administratorski email</label>

    <input
      id="email"
      type="email"
      value="admin@gnail.com"
      autocomplete="username"
    >

    <label for="password">Lozinka</label>

    <input
      id="password"
      type="password"
      placeholder="Unesi svoju lozinku"
      autocomplete="current-password"
    >

    <button id="loginButton">
      PRIJAVI SE
    </button>

    <div id="loginMessage" class="error"></div>
  </section>


  <!-- AUDIT LOG -->
  <section id="auditScreen" class="hidden">

    <div class="panel">

      <div class="topbar">

        <div>
          <h1>Audit Log</h1>
          <div class="status">
            Administratorski pristup
          </div>
          <p id="adminInfo" class="muted"></p>
        </div>

        <div>
          <button id="refreshButton">
            OSVJEŽI
          </button>

          <button id="logoutButton" class="danger">
            ODJAVI SE
          </button>
        </div>

      </div>

      <p id="lastUpdate" class="muted">
        Učitavanje...
      </p>

      <div id="dataMessage"></div>

    </div>


    <div class="panel">

      <h2>Evidencija promjena u bazi</h2>

      <div class="table-wrap">

        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Šema</th>
              <th>Tabela</th>
              <th>Operacija</th>
              <th>Vrijeme</th>
              <th>Korisnik UUID</th>
              <th>Stari podaci</th>
              <th>Novi podaci</th>
            </tr>
          </thead>

          <tbody id="auditRows">
            <tr>
              <td colspan="8">Učitavanje zapisa...</td>
            </tr>
          </tbody>

        </table>

      </div>

    </div>

  </section>

</div>


<script>
  // SUPABASE PODEŠAVANJA

  const SUPABASE_URL =
    "https://uduwpvdjmanrgpumdrfh.supabase.co";

  const SUPABASE_ANON_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVkdXdwdmRqbWFucmdwdW1kcmZoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4MTEwODQsImV4cCI6MjEwMDM4NzA4NH0.zdxIxiCJcaauEP1pm75d1-4YXO1Dn6tsAhZehFh2vsQ";

  const ADMIN_UUID =
    "526b4d88-d95a-43d4-a43b-0cdf2306a245";


  // KREIRANJE SUPABASE KLIJENTA

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


  // ELEMENTI STRANICE

  const loginScreen =
    document.getElementById("loginScreen");

  const auditScreen =
    document.getElementById("auditScreen");

  const loginMessage =
    document.getElementById("loginMessage");

  const auditRows =
    document.getElementById("auditRows");

  let refreshTimer = null;


  // PRIJAVA

  document
    .getElementById("loginButton")
    .addEventListener("click", login);


  async function login() {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    const button =
      document.getElementById("loginButton");

    loginMessage.textContent = "";

    if (!email || !password) {
      loginMessage.textContent =
        "Unesi email i lozinku.";

      return;
    }

    button.disabled = true;
    button.textContent = "PRIJAVA U TOKU...";

    try {

      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

      if (error) {
        throw error;
      }

      if (!data.user || data.user.id !== ADMIN_UUID) {

        await supabaseClient.auth.signOut();

        throw new Error(
          "Ovaj nalog nema administratorska prava za Audit Log."
        );
      }

      document.getElementById("password").value = "";

      await showAuditScreen(data.user);

    } catch (error) {

      loginMessage.textContent =
        "Greška: " + error.message;

    } finally {

      button.disabled = false;
      button.textContent = "PRIJAVI SE";

    }
  }


  // PRIKAZ AUDIT LOG STRANICE

  async function showAuditScreen(user) {

    loginScreen.classList.add("hidden");
    auditScreen.classList.remove("hidden");

    document.getElementById("adminInfo").textContent =
      "Prijavljen administrator: " + user.email;

    await loadAuditLog();

    if (refreshTimer) {
      clearInterval(refreshTimer);
    }

    refreshTimer = setInterval(() => {
      loadAuditLog();
    }, 30000);
  }


  // UČITAVANJE AUDIT LOG PODATAKA

  async function loadAuditLog() {

    const message =
      document.getElementById("dataMessage");

    message.textContent = "";

    try {

      const { data: sessionData, error: sessionError } =
        await supabaseClient.auth.getSession();

      if (
        sessionError ||
        !sessionData.session ||
        sessionData.session.user.id !== ADMIN_UUID
      ) {

        await logout();
        return;
      }


      const { data, error } =
        await supabaseClient
          .from("audit_log")
          .select(`
            id,
            table_schema,
            table_name,
            operation,
            old_data,
            new_data,
            changed_by,
            changed_at
          `)
          .order("id", { ascending: false })
          .limit(200);


      if (error) {
        throw error;
      }


      auditRows.innerHTML = "";

      if (!data || data.length === 0) {

        auditRows.innerHTML =
          '<tr><td colspan="8">Nema dostupnih zapisa.</td></tr>';

      } else {

        data.forEach(record => {

          const tr = document.createElement("tr");

          addCell(tr, record.id);
          addCell(tr, record.table_schema);
          addCell(tr, record.table_name);
          addCell(tr, record.operation);

          addCell(
            tr,
            record.changed_at
              ? new Date(record.changed_at).toLocaleString()
              : ""
          );

          addCell(
            tr,
            record.changed_by || "Nepoznat korisnik"
          );

          addJsonCell(tr, record.old_data);
          addJsonCell(tr, record.new_data);

          auditRows.appendChild(tr);

        });

      }

      document.getElementById("lastUpdate").textContent =
        "Posljednje osvježavanje: " +
        new Date().toLocaleString();

    } catch (error) {

      message.className = "error";

      message.textContent =
        "Greška pri učitavanju: " + error.message;

      auditRows.innerHTML =
        '<tr><td colspan="8">Podaci nisu učitani.</td></tr>';

    }
  }


  // DODAVANJE TEKSTUALNE ĆELIJE

  function addCell(row, value) {

    const td = document.createElement("td");

    td.textContent =
      value === null || value === undefined
        ? ""
        : String(value);

    row.appendChild(td);
  }


  // DODAVANJE JSON ĆELIJE

  function addJsonCell(row, value) {

    const td = document.createElement("td");

    const pre = document.createElement("pre");

    pre.textContent =
      value === null || value === undefined
        ? "—"
        : JSON.stringify(value, null, 2);

    td.appendChild(pre);

    row.appendChild(td);
  }


  // RUČNO OSVJEŽAVANJE

  document
    .getElementById("refreshButton")
    .addEventListener("click", loadAuditLog);


  // ODJAVA

  document
    .getElementById("logoutButton")
    .addEventListener("click", logout);


  async function logout() {

    if (refreshTimer) {
      clearInterval(refreshTimer);
      refreshTimer = null;
    }

    await supabaseClient.auth.signOut();

    auditScreen.classList.add("hidden");
    loginScreen.classList.remove("hidden");

    document.getElementById("password").value = "";

    loginMessage.textContent = "";
    loginMessage.className = "error";

  }


  // PROVJERA POSTOJEĆE SUPABASE SESIJE

  async function checkSession() {

    const { data, error } =
      await supabaseClient.auth.getSession();

    if (error || !data.session) {
      return;
    }

    if (data.session.user.id === ADMIN_UUID) {

      await showAuditScreen(data.session.user);

    } else {

      await supabaseClient.auth.signOut();

    }
  }


  // AUTOMATSKO ODJAVLJIVANJE KAD SESIJA ISTEKNE

  supabaseClient.auth.onAuthStateChange(
    (event, session) => {

      if (
        event === "SIGNED_OUT" ||
        (session && session.user.id !== ADMIN_UUID)
      ) {

        if (refreshTimer) {
          clearInterval(refreshTimer);
          refreshTimer = null;
        }

        auditScreen.classList.add("hidden");
        loginScreen.classList.remove("hidden");

      }

    }
  );


  // POKRETANJE

  checkSession();

</script>

</body>
</html>
