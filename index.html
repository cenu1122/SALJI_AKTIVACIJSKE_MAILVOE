
<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DocBizHub – Aktivacija korisnika</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 25px 15px;
      background: #f1f5f9;
      color: #172033;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 620px;
      margin: 30px auto;
      padding: 28px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }

    h1 {
      margin-top: 0;
      font-size: 25px;
      text-align: center;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin: 17px 0 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
    }

    input:focus {
      outline: 2px solid #93c5fd;
      border-color: #2563eb;
    }

    .mode {
      display: flex;
      gap: 12px;
      margin: 20px 0;
    }

    .mode label {
      flex: 1;
      margin: 0;
      padding: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      cursor: pointer;
      text-align: center;
    }

    .mode input {
      width: auto;
      margin-right: 6px;
    }

    .range {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      border: 0;
      border-radius: 9px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .save {
      background: #475569;
    }

    .save:hover {
      background: #334155;
    }

    .status {
      display: none;
      margin-top: 20px;
      padding: 15px;
      border-radius: 9px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    .success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .info {
      display: block;
      background: #e0f2fe;
      color: #075985;
    }

    .result {
      margin-top: 15px;
      padding: 12px;
      background: #f8fafc;
      border-radius: 8px;
      font-size: 13px;
      max-height: 260px;
      overflow: auto;
    }

    .note {
      margin-top: 22px;
      color: #64748b;
      font-size: 12px;
      line-height: 1.5;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 450px) {
      .container {
        padding: 20px;
      }

      .range {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>DocBizHub</h1>
    <div class="subtitle">Aktivacija korisnika putem e-maila</div>

    <label for="projectUrl">Supabase Project URL</label>
    <input
      id="projectUrl"
      type="url"
      placeholder="https://xxxxxxxx.supabase.co"
    >

    <label for="anonKey">Supabase anon / publishable key</label>
    <input
      id="anonKey"
      type="password"
      placeholder="Unesi anon ili publishable key"
      autocomplete="off"
    >

    <label>Način slanja</label>

    <div class="mode">
      <label>
        <input type="radio" name="mode" value="single" checked>
        Jedan ID
      </label>

      <label>
        <input type="radio" name="mode" value="range">
        Od – do
      </label>
    </div>

    <div id="singleBox">
      <label for="singleId">ID korisnika</label>
      <input
        id="singleId"
        type="number"
        min="1"
        step="1"
        placeholder="Npr. 100"
      >
    </div>

    <div id="rangeBox" hidden>
      <div class="range">
        <div>
          <label for="fromId">Od ID</label>
          <input
            id="fromId"
            type="number"
            min="1"
            step="1"
            placeholder="Npr. 100"
          >
        </div>

        <div>
          <label for="toId">Do ID</label>
          <input
            id="toId"
            type="number"
            min="1"
            step="1"
            placeholder="Npr. 110"
          >
        </div>
      </div>
    </div>

    <button id="sendButton" type="button">
      POŠALJI ZAHTJEV
    </button>

    <button id="saveButton" class="save" type="button">
      SAČUVAJ POSTAVKE
    </button>

    <div id="status" class="status"></div>
    <div id="result" class="result" hidden></div>

    <div class="note">
      Naziv funkcije:
      <strong>AKTIVIRAJ_KORISNIKE_DOCBIZHUB_GMAIL_RESEND</strong>
      <br><br>
      Brojevi se automatski povećavaju nakon uspješnog odgovora funkcije
      bez evidentiranih grešaka.
    </div>
  </div>

  <script>
    const FUNCTION_NAME =
      "AKTIVIRAJ_KORISNIKE_DOCBIZHUB_GMAIL_RESEND";

    const STORAGE_KEY = "docbizhub_activation_sender_v1";

    const $ = (id) => document.getElementById(id);

    const projectUrl = $("projectUrl");
    const anonKey = $("anonKey");
    const singleId = $("singleId");
    const fromId = $("fromId");
    const toId = $("toId");
    const sendButton = $("sendButton");
    const saveButton = $("saveButton");
    const statusBox = $("status");
    const resultBox = $("result");

    function getMode() {
      return document.querySelector(
        'input[name="mode"]:checked'
      ).value;
    }

    function showMode() {
      const mode = getMode();

      $("singleBox").hidden = mode !== "single";
      $("rangeBox").hidden = mode !== "range";
    }

    document.querySelectorAll('input[name="mode"]').forEach(radio => {
      radio.addEventListener("change", showMode);
    });

    function showStatus(message, type) {
      statusBox.className = "status " + type;
      statusBox.textContent = message;
    }

    function getSettings() {
      return {
        projectUrl: projectUrl.value.trim(),
        anonKey: anonKey.value.trim(),
        mode: getMode(),
        singleId: singleId.value,
        fromId: fromId.value,
        toId: toId.value
      };
    }

    function saveSettings(showMessage = true) {
      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(getSettings())
      );

      if (showMessage) {
        showStatus(
          "Postavke su sačuvane u localStorage.",
          "success"
        );
      }
    }

    function loadSettings() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);

        if (!saved) return;

        const data = JSON.parse(saved);

        projectUrl.value = data.projectUrl || "";
        anonKey.value = data.anonKey || "";
        singleId.value = data.singleId || "";
        fromId.value = data.fromId || "";
        toId.value = data.toId || "";

        const mode = data.mode || "single";

        const radio = document.querySelector(
          `input[name="mode"][value="${mode}"]`
        );

        if (radio) radio.checked = true;

        showMode();
      } catch (error) {
        console.error("Greška pri učitavanju postavki:", error);
      }
    }

    function getPayload() {
      if (getMode() === "single") {
        const id = Number(singleId.value);

        if (!Number.isSafeInteger(id) || id < 1) {
          throw new Error("Unesi ispravan ID korisnika.");
        }

        return { id };
      }

      const od = Number(fromId.value);
      const doId = Number(toId.value);

      if (
        !Number.isSafeInteger(od) ||
        !Number.isSafeInteger(doId) ||
        od < 1 ||
        doId < 1
      ) {
        throw new Error("Unesi ispravne početni i završni ID.");
      }

      if (od > doId) {
        throw new Error("Početni ID ne može biti veći od završnog.");
      }

      return {
        od: od,
        do: doId
      };
    }

    function incrementNumbers(payload) {
      if (payload.id !== undefined) {
        singleId.value = payload.id + 1;
      } else {
        fromId.value = payload.od + 1;
        toId.value = payload.do + 1;
      }

      saveSettings(false);
    }

    async function sendRequest() {
      sendButton.disabled = true;
      sendButton.textContent = "ŠALJEM...";

      resultBox.hidden = true;
      resultBox.textContent = "";

      try {
        const url = projectUrl.value.trim().replace(/\/+$/, "");
        const key = anonKey.value.trim();

        if (!url || !/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(url)) {
          throw new Error("Unesi ispravan Supabase Project URL.");
        }

        if (!key) {
          throw new Error("Unesi Supabase anon / publishable key.");
        }

        const payload = getPayload();

        saveSettings(false);

        showStatus("Zahtjev se šalje Supabase funkciji...", "info");

        const response = await fetch(
          `${url}/functions/v1/${FUNCTION_NAME}`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "apikey": key,
              "Authorization": `Bearer ${key}`
            },
            body: JSON.stringify(payload)
          }
        );

        const responseText = await response.text();

        let data;

        try {
          data = JSON.parse(responseText);
        } catch {
          throw new Error(
            "Funkcija nije vratila ispravan JSON odgovor. HTTP: " +
            response.status + "\n" + responseText
          );
        }

        resultBox.hidden = false;
        resultBox.textContent = JSON.stringify(data, null, 2);

        if (!response.ok || data.success !== true) {
          throw new Error(
            data.error ||
            data.message ||
            `Greška HTTP ${response.status}`
          );
        }

        const errors = Number(data.greske || 0);

        if (errors > 0) {
          showStatus(
            `Funkcija je odgovorila, ali je prijavila ${errors} grešaka.\n` +
            "Brojevi nisu povećani. Pregledaj rezultat ispod.",
            "error"
          );
          return;
        }

        incrementNumbers(payload);

        showStatus(
          "Zahtjev je uspješno obrađen!\n\n" +
          "Poslani podaci: " + JSON.stringify(payload) +
          "\n\nBrojevi su automatski povećani i sačuvani u localStorage.",
          "success"
        );

      } catch (error) {
        showStatus(
          "ZAHTJEV NIJE USPJEŠNO ZAVRŠEN\n\n" + error.message,
          "error"
        );
      } finally {
        sendButton.disabled = false;
        sendButton.textContent = "POŠALJI ZAHTJEV";
      }
    }

    sendButton.addEventListener("click", sendRequest);

    saveButton.addEventListener("click", () => {
      saveSettings(true);
    });

    loadSettings();
    showMode();
  </script>
</body>
</html>
